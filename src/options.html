<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab and Tab Group Shortcuts</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        padding: 8px 16px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      p {
        color: #666;
        margin-left: 24px;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="autoCloseStaleTabs" />
      Close tabs to the right of the <code>---</code> tab group after 7 days
      without a visit
    </label>
    <p>
      Pinned and active tabs are never closed. With no tab group titled
      <code>---</code>, nothing is closed.
    </p>
    <p>
      To change keyboard shortcuts, go to
      <code>chrome://extensions/shortcuts</code>.
    </p>
    <script type="module" src="options.js"></script>
  </body>
</html>
